<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Well Spoken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..500;1,9..144,400..500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f4ede0;
    --ink:#1f2a21;
    --forest:#1e3328;
    --sage:#4b6a52;
    --muted:#7a8278;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--cream);color:var(--ink);
    font-family:"Fraunces",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:40px 24px;text-align:center;
    background-image:radial-gradient(ellipse at 70% 0%, rgba(75,106,82,.08), transparent 55%),
                     radial-gradient(ellipse at 20% 100%, rgba(235,224,200,.5), transparent 50%);
  }
  h1{
    font-family:"Fraunces",serif;font-weight:400;font-style:italic;
    font-size:clamp(3.2rem, 9vw, 6rem);line-height:1;letter-spacing:-.02em;
    margin:0 0 26px;color:var(--ink);
  }
  .coming{
    font-family:"Caveat",cursive;font-weight:500;
    font-size:clamp(1.6rem, 3.2vw, 2.1rem);color:var(--sage);line-height:1;
    letter-spacing:.01em;
  }
</style>
</head>
<body>
  <main>
    <h1>Well Spoken</h1>
    <div class="coming">Coming soon</div>
  </main>
</body>
</html>
